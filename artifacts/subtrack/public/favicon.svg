<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7.5" fill="#0f172a"/>

  <!-- Static dim ring -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.2"/>

  <!-- Animated sweeping arc (SMIL — works as a browser-tab favicon) -->
  <circle cx="16" cy="16" r="13.5" fill="none"
          stroke="#818cf8" stroke-width="1.5"
          stroke-dasharray="14 71" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 16 16" to="360 16 16"
                      dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- R letterform — stem -->
  <rect x="9.5" y="8" width="3" height="16" rx="1.5" fill="white"/>

  <!-- R letterform — bowl -->
  <path d="M 12.5 8.5 L 18 8.5 Q 22 8.5 22 12 Q 22 15.5 18 15.5 L 12.5 15.5"
        fill="none" stroke="white" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- R letterform — leg -->
  <line x1="14.5" y1="15.5" x2="21" y2="23.5"
        stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
